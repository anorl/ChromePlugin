<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>自动签到</title>
  <link rel="stylesheet" href="popup.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <div class="wrap">
    <h2>自动签到</h2>

    <section class="schedule">
      <div class="row">
        <label>每日执行时间：</label>
        <input type="time" id="time" required />
        <button id="saveTime">保存时间</button>
        <button id="runNow">立即执行</button>
        <button id="stopRun" class="danger">停止运行</button>
        <span id="runFlag" class="badge">闲置</span>
      </div>
      <small>提示：任务总时限为 <b>5 秒/每条</b>；若你已手动成功签到，程序会自动跳过。</small>
    </section>

    <!-- 合并后的单表：任务ID、任务名称、时间、状态、原因 -->
    <section class="records">
      <div class="table">
        <div class="thead">
          <div>任务ID</div>
          <div>任务名称</div>
          <div>时间</div>
          <div>状态</div>
          <div>原因</div>
          <div>操作</div>
        </div>
        <div class="tbody" id="recordBody"></div>
      </div>
      <div id="emptyHint" class="empty">暂无记录</div>
    </section>

    <footer>
      <small>状态含义：<b>success</b>=成功，<b>skipped</b>=已手动完成或停止跳过，<b>timeout</b>=超时5秒，<b>failed</b>=失败。</small>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
