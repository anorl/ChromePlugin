<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>qBittorrent 列表导出</title>
  <style>
    :root {
      --primary: #007acc;
      --primary-hover: #0061aa;
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --border-radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      width: 260px; height: 180px;
      font-family: "Segoe UI", "PingFang SC", "Roboto", sans-serif;
      background: var(--bg);
      display: flex; justify-content: center; align-items: center;
    }
    .card {
      width: 92%; padding: 18px;
      background: var(--card-bg); border-radius: var(--border-radius);
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 6px;
    }
    .header img { width: 28px; height: 28px; }
    .title { font-size: 16px; font-weight: 600; color: #333; }
    .desc {
      font-size: 12px; line-height: 1.4em; color: #666;
      margin: 6px 0 16px;
    }
    #exportBtn {
      width: 100%; height: 38px;
      display: flex; justify-content: center; align-items: center;
      gap: 6px; border: none;
      border-radius: 6px; cursor: pointer;
      background: var(--primary); color: #fff; font-weight: 600;
      transition: background .25s ease;
    }
    #exportBtn:hover { background: var(--primary-hover); }
    #exportBtn[disabled] { background: #b3c8dc; cursor: not-allowed; }
    #exportBtn svg { width: 18px; height: 18px; fill: currentColor; }

    .status {
      margin-top: 10px; text-align: center;
      font-size: 12px; color: #1a73e8; display: none;
    }
    footer {
      margin-top: 12px; text-align: center;
      font-size: 11px; color: #aaa;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- 标题区 -->
    <div class="header">
      <img src="icon.png" alt="qb">
      <div class="title">qBittorrent 列表导出</div>
    </div>

    <!-- 描述 -->
    <div class="desc">
      一键导出当前种子列表为&nbsp;CSV，含站点、Tracker 等关键信息。
    </div>

    <!-- 主按钮 -->
    <button id="exportBtn">
      <!-- download arrow icon -->
      <svg viewBox="0 0 24 24">
        <path d="M5 20h14v-2H5v2zm7-18-5.5 5.5h4v6h3v-6h4L12 2z"/>
      </svg>
      导出&nbsp;CSV
    </button>

    <!-- 状态提示 -->
    <div id="status" class="status">正在导出，请稍候…</div>

    <!-- 页脚 -->
    <footer>v1.0 · by dhxdl</footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
