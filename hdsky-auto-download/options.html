<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HDSky 扩展设置</title>
    <style>
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:20px;line-height:1.6;}
      label{display:block;margin:10px 0 4px;}
      input[type="number"],input[type="text"]{width:240px;padding:6px;}
      button{margin-top:12px;padding:8px 12px;border-radius:8px;border:none;background:#3b82f6;color:#fff;cursor:pointer}
      .hint{color:#666;font-size:12px}
    </style>
  </head>
  <body>
    <h2>HDSky 扩展设置</h2>

    <label>每个 notice 页打开间隔（毫秒）</label>
    <input id="openIntervalMs" type="number" min="300" step="100" />

    <label>保存到子目录（相对 Chrome 默认下载目录）</label>
    <input id="subDir" type="text" placeholder="HDSky" />
    <div class="hint">如需保存到 <code>D:\Downloads</code>，请在 Chrome 设置里把“下载位置”设为 <code>D:\Downloads</code>。</div>

    <label><input id="closeNoticeTabAfterDownload" type="checkbox" /> 下载完成后自动关闭 notice 标签</label>

    <div>
      <button id="saveBtn">保存</button>
      <span id="savedTip" class="hint"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
