<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>HDSky 自动勾选</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
           margin: 0; padding: 14px 16px; width: 280px; color: #111; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
    .status { font-weight: 600; }
    .status.on { color: #16a34a; }
    .status.off { color: #ef4444; }
    button { cursor: pointer; border: 0; border-radius: 8px; padding: 8px 12px; color: #fff; }
    .btn-on  { background: #16a34a; }
    .btn-off { background: #ef4444; }
    .hint { color: #666; font-size: 12px; margin-top: 8px; line-height: 1.5; }
    code { background: #f3f4f6; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>下载页自动勾选</h1>

  <div class="row">
    <div>「我会提高分享率的」自动勾选</div>
    <div id="status" class="status off">未启用</div>
  </div>

  <div class="row">
    <button id="toggle" class="btn-on">启用</button>
  </div>

  <div class="hint">
    仅在 <code>downloadnotice.php</code> 页面生效。启用后将自动勾选该复选框（不自动下载）。<br/>
    如遇页面加载较慢，会自动等待元素出现。
  </div>

  <script src="popup.js"></script>
</body>
</html>
