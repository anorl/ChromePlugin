<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PT 种子认领助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="logo">PT</div>
        <div>
          <h1>种子认领助手</h1>
          <p id="pageStatus">正在连接页面…</p>
        </div>
      </header>

      <section class="stats">
        <div><strong id="available">—</strong><span>可认领</span></div>
        <div><strong id="completed">0</strong><span>已完成</span></div>
        <div><strong id="failed">0</strong><span>失败</span></div>
      </section>

      <section class="settings">
        <label>
          弹窗点击间隔（秒）
          <span><input id="actionMin" type="number" min="0.25" max="10" step="0.05" /> 至 <input id="actionMax" type="number" min="0.25" max="15" step="0.05" /></span>
        </label>
        <label>
          种子之间间隔（秒）
          <span><input id="torrentMin" type="number" min="1" max="60" step="0.5" /> 至 <input id="torrentMax" type="number" min="1" max="120" step="0.5" /></span>
        </label>
      </section>

      <p id="message" class="message">尚未开始</p>
      <div class="actions">
        <button id="start" class="primary">开始认领</button>
        <button id="stop" disabled>停止</button>
      </div>
      <p class="hint">请保持目标用户详情页打开。页面刷新后会自动继续。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
